# SonarCloud Configuration for OutcomeOps AI Assist
sonar.projectKey=bcarpio_outcome-ops-ai-assist
sonar.organization=bcarpio
sonar.host.url=https://sonarcloud.io

# Python version (matches Lambda runtime)
sonar.python.version=3.12

# Sources and tests
sonar.sources=lambda,ui/src
sonar.tests=lambda/tests,ui/tests

# Coverage reports
sonar.python.coverage.reportPaths=lambda/coverage.xml
sonar.python.xunit.reportPath=lambda/junit.xml
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/*_test.py,\
  **/tests/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/bin/**,\
  **/lib/**,\
  **/node_modules/**

sonar.test.inclusions=\
  **/tests/**/*.py,\
  **/tests/**/*.ts,\
  **/tests/**/*.tsx

# Duplicated lines - integration handlers (teams/sharepoint/outlook/confluence)
# legitimately share patterns; main.py FastAPI wrappers are intentionally similar
sonar.cpd.exclusions=\
  lambda/teams-integration/**,\
  lambda/teams-sync/**,\
  lambda/teams-scheduler/**,\
  lambda/sharepoint-integration/**,\
  lambda/sharepoint-sync/**,\
  lambda/sharepoint-scheduler/**,\
  lambda/outlook-integration/**,\
  lambda/outlook-sync/**,\
  lambda/outlook-scheduler/**,\
  lambda/confluence-integration/**,\
  lambda/confluence-sync/**,\
  lambda/confluence-scheduler/**,\
  lambda/**/main.py
