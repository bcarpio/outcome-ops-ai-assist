name: Sync Docs to Confluence

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'

  workflow_dispatch:

env:
  CONFLUENCE_API: ${{ secrets.CONFLUENCE_API }}
  CONFLUENCE_API_USER: ${{ secrets.CONFLUENCE_API_USER }}
  CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
  SPACE_KEY: OCD

jobs:
  sync-docs:
    name: Sync Documentation to Confluence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git delta

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Junction
        run: pip install confluence-junction

      - name: Sync docs to Confluence
        run: |
          # Sync changes from previous commit
          junction -s "$SPACE_KEY" delta --content-path docs/ HEAD~1 main

      - name: Summary
        if: always()
        run: |
          echo "## Confluence Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Space: $SPACE_KEY" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
