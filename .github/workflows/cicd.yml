name: OutcomeOps AI Assist CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      approved:
        description: 'I have reviewed the plan and approve'
        required: true
        type: boolean

env:
  AWS_REGION: us-west-2
  TERRAFORM_DIR: terraform
  ENVIRONMENT: dev
  TF_VARS_FILE: dev.tfvars

permissions:
  id-token: write
  contents: read

jobs:

  security-scans:
    name: Run Talisman, Trivy, Snyk
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Talisman
        run: |
          curl -Lo talisman https://github.com/thoughtworks/talisman/releases/latest/download/talisman_linux_amd64
          chmod +x talisman
          sudo mv talisman /usr/local/bin/

      - name: Run Talisman Scan
        run: |
          talisman --githook pre-commit || true

      - name: Process Talisman Report
        run: |
          if [ ! -f talisman_report/talisman_reports/data/report.json ]; then
            echo "✅ No high severity issues detected by Talisman."
            exit 0
          fi

          echo "🔎 Processing Talisman findings..."

          # Extract the summary types
          echo "Summary of Detected Types:" > talisman_violations.txt
          jq -r '.summary.types | to_entries[] | "\(.key): \(.value)"' talisman_report/talisman_reports/data/report.json >> talisman_violations.txt

          echo "" >> talisman_violations.txt
          echo "Detailed Failures:" >> talisman_violations.txt

          # Extract filename, severity, and message for high/critical severities
          jq -r '.results[]
            | select(.failure_list != null)
            | . as $result
            | $result.failure_list[]
            | select(.severity == "high" or .severity == "critical")
            | "Filename: \($result.filename)\nSeverity: \(.severity)\nMessage: \(.message)\n"' talisman_report/talisman_reports/data/report.json >> talisman_violations.txt

          echo ""
          cat talisman_violations.txt

          # Fail if any high/critical findings
          if grep -q "Severity: high\|Severity: critical" talisman_violations.txt; then
            echo "🚨 High severity issues found in Talisman scan!"
            exit 1
          else
            echo "✅ No high severity issues detected by Talisman."
          fi

      - name: Trivy - Scan Terraform
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: 'v0.69.3'
          scan-type: config
          scan-ref: ${{ env.TERRAFORM_DIR }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      - name: Trivy - Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: 'v0.69.3'
          scan-type: fs
          scan-ref: '.'
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: '.trivyignore'

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ui

      - name: Upload UI coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage/lcov.info

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [security-scans, ui-tests]
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all Lambda function requirements
          for req in lambda/*/requirements.txt; do
            if [ -f "$req" ]; then
              pip install -r "$req"
            fi
          done
          # Database integration shares its deps at the lambda root
          # (consumed by both database-integration and database-sync
          # container builds) — the per-Lambda glob above doesn't
          # match it. Install explicitly so unit tests that touch the
          # introspection_helpers / mssql_stats modules can resolve
          # databao_context_engine + driver imports at patch time.
          if [ -f lambda/db-introspection-requirements.txt ]; then
            pip install -r lambda/db-introspection-requirements.txt
          fi
          # Install test dependencies. pytest-timeout is required by
          # `timeout = 60` in lambda/tests/pytest.ini (ADR-013 backstop
          # against unbounded pagination-mock loops). Without it pinned
          # explicitly here, `pytest-timeout` only arrived transitively
          # via per-Lambda requirements -- if any of those pins drop it,
          # pytest silently ignores the timeout option and the ADR-013
          # backstop vanishes in CI.
          pip install pytest pytest-cov pytest-asyncio pytest-timeout boto3 moto requests httpx

      - name: Run tests with coverage
        run: |
          # Run pytest from project root for correct coverage paths
          # Using coverage run to track dynamically loaded modules
          # Note: unit tests are the only Lambda test suite in the repo
          # today. An integration/ subdir used to exist as a placeholder
          # but was removed 2026-07-06 (no e2e tests were ever seeded).
          # Deselect @pytest.mark.slow tests in CI. The symbol-graph
          # perf regression-guard at 10k edges stages a lot of items
          # through moto's serializer and, under coverage
          # instrumentation on GH Actions runners, blows past the
          # 60s pytest-timeout. The test still runs locally for
          # benchmark dev (`pytest -m slow` or unfiltered).
          # Measure ALL of lambda/ instead of a hardcoded directory
          # allowlist. The old explicit --source list silently drifted:
          # every Lambda family added after it was written (azure-devops-*,
          # database-*, onedrive-*, onenote-*, analytics-*,
          # replication-applier, ...) had passing tests in this job but
          # was absent from coverage.xml, so SonarCloud reported those
          # handlers at 0% and failed the coverage gate. Files that truly
          # have no tests stay absent from coverage.xml and SonarCloud
          # still counts them as 0% — the aggregate remains honest.
          # Non-runtime dirs are omitted.
          coverage run \
            --source=lambda \
            --omit='lambda/tests/*,lambda/runtime-layer/*,lambda/terraform-layer/*,lambda/.venv/*,lambda/.ca-bundles-staging/*,lambda/.license-layer-staging/*' \
            -m pytest lambda/tests/unit/ \
            -m "not slow" \
            --junitxml=lambda/junit.xml \
            -v
          coverage xml -o lambda/coverage.xml
          coverage report --skip-covered

      - name: Download UI coverage
        uses: actions/download-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage

  terraform-validate:
    name: Terraform Init & Validate
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certifi
        run: pip install certifi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -backend=false
        working-directory: ${{ env.TERRAFORM_DIR }}

      # Builds the platform-CA Lambda layer zip on disk so terraform's
      # filebase64sha256() in lambda-platform-ca-layer.tf has a file to
      # hash during validate. Must run BEFORE `terraform validate`. With
      # the default empty platform_ca_bundle_ssm_param_arns the script
      # ships a certifi-only passthrough layer so this is safe on
      # first-time deploys too -- see scripts/build-platform-ca-layer.sh.
      - name: Build platform CA layer
        run: make build-platform-layer
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}

      # ADR-022 parity guard: fails the build when a primary module's
      # env keys / IAM statements drift from its *_secondary mirror.
      # Divergence here is invisible in steady state and only surfaces
      # at failover -- six modules had drifted when this check landed.
      - name: HA primary/secondary parity
        run: make check-ha-parity

