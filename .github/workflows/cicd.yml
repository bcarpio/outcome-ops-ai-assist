name: OutcomeOps AI Assist CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      approved:
        description: 'I have reviewed the plan and approve'
        required: true
        type: boolean

env:
  AWS_REGION: us-west-2
  TERRAFORM_DIR: terraform
  ENVIRONMENT: dev
  TF_VARS_FILE: dev.tfvars

permissions:
  id-token: write
  contents: read

jobs:

  security-scans:
    name: Run Talisman
    runs-on: ubuntu-latest
    environment: dev
    env:
      TALISMAN_VERSION: v1.37.0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Talisman (pinned, checksum verified)
        run: |
          base="https://github.com/thoughtworks/talisman/releases/download/${TALISMAN_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/talisman_linux_amd64"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/checksums"
          grep ' talisman_linux_amd64$' checksums | sha256sum -c -
          sudo install -m 0755 talisman_linux_amd64 /usr/local/bin/talisman
          rm talisman_linux_amd64 checksums

      - name: Scan every tracked file
        # Talisman's pre-commit hook scans staged changes, and a fresh CI
        # checkout has none, so the hook alone passes without scanning
        # anything. Stage the whole tree against an empty root commit so
        # every tracked file is checked, with .talismanrc (reviewed
        # allowlist, threshold: high) applied. A finding fails the job.
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git checkout -q --orphan talisman-scan
          git rm -rq --cached .
          git commit -q --allow-empty -m "empty root for scanning"
          git add -A
          echo "Scanning $(git diff --cached --name-only | wc -l) files"
          talisman --githook pre-commit

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ui

      - name: Upload UI coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage/lcov.info

  terraform-validate:
    name: Terraform Init & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certifi
        run: pip install certifi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -backend=false
        working-directory: ${{ env.TERRAFORM_DIR }}

      # Builds the platform-CA Lambda layer zip on disk so terraform's
      # filebase64sha256() in lambda-platform-ca-layer.tf has a file to
      # hash during validate. Must run BEFORE `terraform validate`. With
      # the default empty platform_ca_bundle_ssm_param_arns the script
      # ships a certifi-only passthrough layer so this is safe on
      # first-time deploys too -- see scripts/build-platform-ca-layer.sh.
      - name: Build platform CA layer
        run: make build-platform-layer
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}

      # ADR-022 parity guard: fails the build when a primary module's
      # env keys / IAM statements drift from its *_secondary mirror.
      # Divergence here is invisible in steady state and only surfaces
      # at failover -- six modules had drifted when this check landed.
      - name: HA primary/secondary parity
        run: make check-ha-parity

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: ui-tests
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history for accurate new-code detection + blame.
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: make setup

      - name: Run Python tests with coverage
        # Produces lambda/coverage.xml + lambda/junit.xml consumed by
        # sonar-project.properties (python.coverage.reportPaths / xunit).
        run: |
          source venv/bin/activate
          make test-coverage

      - name: Download UI coverage (lcov.info from the ui-tests job)
        uses: actions/download-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        # Fails the job (and the PR status check) when the gate is red,
        # e.g. new-code coverage below 80%.
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

