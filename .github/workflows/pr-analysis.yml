name: PR Analysis

# Invokes the analyze-pr Lambda directly via OIDC (no public API Gateway
# webhook). The product deploys into the customer's own AWS account, where an
# internet-facing webhook endpoint is unwanted inbound attack surface and GHES
# runners often cannot reach one; CI already holds a scoped identity, so it
# calls the Lambda directly. Mirrors pr-commands.yml (slash-command path).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write      # Required for OIDC
  contents: read       # Required to checkout code
  pull-requests: read  # Required to read PR details

env:
  AWS_REGION: us-west-2
  ENVIRONMENT: prd

# One analysis per PR at a time; a new push supersedes an in-flight run so
# analyze-pr's upserted comments reflect the latest head.
concurrency:
  group: pr-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze-pr:
    name: Analyze PR
    runs-on: ubuntu-latest
    environment: prd
    env:
      # Spoke role ARN kept as a SECRET (masked in public logs) rather than a
      # repo variable. Read via env so the optional-chain `if:` below is
      # reliable -- secrets referenced directly in `if:` are flaky.
      CI_SPOKE_ROLE_ARN: ${{ secrets.CI_SPOKE_ROLE_ARN }}
    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PR-Analysis

      # Optional second assume for a hub/spoke identity: if the CI_SPOKE_ROLE_ARN
      # repo SECRET is set, assume the workload-account role that can invoke
      # analyze-pr, using the credentials from the step above (role-chaining).
      # Leave the secret unset for a single-account / direct-OIDC role, where the
      # first assume already holds invoke rights. Keeps this workflow topology-
      # agnostic -- no hub/spoke assumptions baked in, it is pure config.
      - name: Assume workload CI role (hub/spoke)
        if: ${{ env.CI_SPOKE_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_SPOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-session-name: GitHubActions-PR-Analysis-Spoke
          # The hub->spoke chained AssumeRole is not granted sts:TagSession; skip
          # the default session tags (they are unused here -- ADR-016 cost
          # attribution is on the Bedrock inference profiles, not STS sessions).
          role-skip-session-tagging: true

      - name: Invoke analyze-pr Lambda
        # Event values go through env, never inline into run: (see pr-commands.yml).
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FUNCTION_NAME="${ENVIRONMENT}-outcome-ops-ai-assist-analyze-pr"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_num "$PR_NUMBER" \
            '{
              repository: $repo,
              pr_number: $pr_num,
              provider: "github"
            }')

          echo "Invoking Lambda: $FUNCTION_NAME"
          echo "Payload: $PAYLOAD"

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json

          echo "Lambda response:"
          cat /tmp/response.json

          if grep -q '"statusCode": 4' /tmp/response.json; then
            echo "analyze-pr failed with client error"
            exit 1
          fi

          if grep -q '"statusCode": 5' /tmp/response.json; then
            echo "analyze-pr failed with server error"
            exit 1
          fi

          echo "PR analysis dispatched successfully"
