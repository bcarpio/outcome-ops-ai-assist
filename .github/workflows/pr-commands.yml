name: PR Commands

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write      # Required for OIDC
  contents: read       # Required to checkout code
  pull-requests: read  # Required to read PR details

env:
  AWS_REGION: us-west-2
  ENVIRONMENT: prd

jobs:
  handle-command:
    name: Handle PR Command
    runs-on: ubuntu-latest
    environment: prd
    # Only run on PR comments (not issue comments) that start with "outcomeops:"
    # and only for commenters with write-level association. This job mints prd
    # AWS credentials, so a comment from an unaffiliated account must never
    # reach it.
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'outcomeops:') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    env:
      # Spoke role ARN kept as a SECRET (masked in public logs); read via env
      # so the optional-chain `if:` below is reliable.
      CI_SPOKE_ROLE_ARN: ${{ secrets.CI_SPOKE_ROLE_ARN }}

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('branch', pr.data.head.ref);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PR-Commands

      # Optional second assume for a hub/spoke identity (same pattern as
      # pr-analysis.yml): if CI_SPOKE_ROLE_ARN is set, chain into the
      # workload-account role that can invoke handle-command. Unset = single
      # assume (direct/self-contained OIDC role). Keeps this workflow
      # topology-agnostic.
      - name: Assume workload CI role (hub/spoke)
        if: ${{ env.CI_SPOKE_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_SPOKE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-session-name: GitHubActions-PR-Commands-Spoke
          # Hub->spoke chained AssumeRole lacks sts:TagSession; skip session tags
          # (unused here). See pr-analysis.yml.
          role-skip-session-tagging: true

      - name: Invoke Handle Command Lambda
        # Every value that comes from the event or the PR (comment body,
        # commenter, head branch name) is attacker-controlled. Pass it through
        # env and read it as a quoted shell variable. Never interpolate
        # github.event.* expressions or PR-derived step outputs into run: text:
        # Actions substitutes them before bash parses the script, so a quote in
        # the value becomes shell code.
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          FUNCTION_NAME="${ENVIRONMENT}-outcome-ops-ai-assist-handle-command"

          # First line of the comment; jq does the JSON escaping
          COMMAND=$(printf '%s\n' "$COMMENT_BODY" | head -1)

          PAYLOAD=$(jq -n \
            --arg cmd "$COMMAND" \
            --argjson pr_num "$PR_NUMBER" \
            --arg repo "$REPO" \
            --arg commenter "$COMMENTER" \
            --arg branch "$PR_BRANCH" \
            '{
              command: $cmd,
              pr_number: $pr_num,
              repo: $repo,
              commenter: $commenter,
              branch: $branch
            }')

          echo "Invoking Lambda: $FUNCTION_NAME"
          echo "Payload: $PAYLOAD"

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json

          echo "Lambda response:"
          cat /tmp/response.json

          # Check for errors in response
          if grep -q '"statusCode": 4' /tmp/response.json; then
            echo "Command failed with client error"
            exit 1
          fi

          if grep -q '"statusCode": 5' /tmp/response.json; then
            echo "Command failed with server error"
            exit 1
          fi

          echo "Command processed successfully"
