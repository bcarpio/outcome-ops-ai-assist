[pytest]
# Pytest configuration for OutcomeOps AI Assist Lambda tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = unit integration

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, AWS services)
    slow: Slow-running tests

# Coverage options (when using --cov)
[coverage:run]
source =
    ../analyze-pr
    ../ask-claude
    ../audit-alert
    ../chat
    ../confluence-integration
    ../confluence-scheduler
    ../confluence-sync
    ../delete-worker
    ../file-ingestion
    ../generate-code
    ../github-integration
    ../github-scheduler
    ../github-sync
    ../handle-command
    ../jira-integration
    ../jira-scheduler
    ../jira-sync
    ../outlook-integration
    ../outlook-scheduler
    ../outlook-sync
    ../process-batch-summary
    ../process-documents
    ../process-pr-check
    ../process-repo-summary
    ../query-kb
    ../run-tests
    ../shared
    ../vector-query
    ../workspace-management
omit = */tests/*,*/venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
