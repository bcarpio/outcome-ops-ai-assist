[pytest]
# Pytest configuration for OutcomeOps AI Assist Lambda tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Per-test timeout (seconds). Safety net for runaway loops in test code -
# notably bare-MagicMock'd table.scan inside a LastEvaluatedKey while-loop,
# which previously crashed the test host. See ADR-013 and commit f18e8e6.
timeout = 60
timeout_method = thread

# Test paths
testpaths = unit integration

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, AWS services)
    slow: Slow-running tests

# Coverage configuration lives in .coveragerc (coverage.py does not read
# pytest.ini, so a [coverage:run] section here would be silently ignored).
